openapi: 3.1.0
info:
  title: Pulso API
  version: 0.1.0
  description: API for multi-organization service monitoring.
servers:
  - url: http://localhost:8080
    description: Local development API
security:
  - cookieAuth: []
paths:
  /healthz:
    get:
      operationId: getHealth
      security: []
      summary: Report API process liveness
      tags: [System]
      responses:
        "200":
          description: The API process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /readyz:
    get:
      operationId: getReadiness
      security: []
      summary: Report API dependency readiness
      tags: [System]
      responses:
        "200":
          description: PostgreSQL is reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: PostgreSQL is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnavailableStatus"
  /api/v1/auth/register:
    post:
      operationId: register
      security: []
      summary: Register a user and create an owner organization
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registration succeeded and a session cookie was issued.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Identity"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "403":
          $ref: "#/components/responses/OriginForbidden"
        "409":
          description: The email is already registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/auth/login:
    post:
      operationId: login
      security: []
      summary: Log in and create a session
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login succeeded and a session cookie was issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Identity"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "401":
          description: Invalid email or password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/OriginForbidden"
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the current session
      tags: [Authentication]
      security: [{ cookieAuth: [] }]
      responses:
        "204":
          description: The session was revoked and the cookie was cleared.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OriginForbidden"
  /api/v1/auth/me:
    get:
      operationId: getCurrentIdentity
      summary: Get the authenticated user and organizations
      tags: [Authentication]
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: The authenticated identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Identity"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/orgs/{organizationID}:
    get:
      operationId: getOrganization
      summary: Get an organization through an authenticated membership
      tags: [Organizations]
      security: [{ cookieAuth: [] }]
      parameters:
        - name: organizationID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The organization and the current user's role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OrganizationForbidden"
  /api/v1/orgs/{organizationID}/monitors:
    get:
      operationId: listMonitors
      summary: List organization monitors with pagination
      tags: [Monitors]
      security: [{ cookieAuth: [] }]
      parameters:
        - name: organizationID
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        "200":
          description: A page of monitors.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MonitorList" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OrganizationForbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    post:
      operationId: createMonitor
      summary: Create an HTTP monitor
      tags: [Monitors]
      security: [{ cookieAuth: [] }]
      parameters:
        - name: organizationID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MonitorInput" }
      responses:
        "201":
          description: The monitor was created in UNKNOWN state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Monitor" }
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OrganizationForbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/orgs/{organizationID}/monitors/{monitorID}:
    get:
      operationId: getMonitor
      summary: Get a monitor
      tags: [Monitors]
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/OrganizationID"
        - $ref: "#/components/parameters/MonitorID"
      responses:
        "200":
          description: The monitor.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Monitor" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OrganizationForbidden"
        "404":
          $ref: "#/components/responses/MonitorNotFound"
    patch:
      operationId: updateMonitor
      summary: Update monitor configuration
      tags: [Monitors]
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/OrganizationID"
        - $ref: "#/components/parameters/MonitorID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MonitorUpdateInput" }
      responses:
        "200":
          description: The updated monitor.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Monitor" }
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OrganizationForbidden"
        "404":
          $ref: "#/components/responses/MonitorNotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      operationId: deleteMonitor
      summary: Delete a monitor
      tags: [Monitors]
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/OrganizationID"
        - $ref: "#/components/parameters/MonitorID"
      responses:
        "204":
          description: The monitor was deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OrganizationForbidden"
        "404":
          $ref: "#/components/responses/MonitorNotFound"
  /api/v1/orgs/{organizationID}/monitors/{monitorID}/pause:
    post:
      operationId: pauseMonitor
      summary: Pause monitor scheduling
      tags: [Monitors]
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/OrganizationID"
        - $ref: "#/components/parameters/MonitorID"
      responses:
        "200":
          description: The paused monitor.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Monitor" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OrganizationForbidden"
        "404":
          $ref: "#/components/responses/MonitorNotFound"
  /api/v1/orgs/{organizationID}/monitors/{monitorID}/resume:
    post:
      operationId: resumeMonitor
      summary: Resume monitor scheduling
      tags: [Monitors]
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/OrganizationID"
        - $ref: "#/components/parameters/MonitorID"
      responses:
        "200":
          description: The resumed monitor.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Monitor" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OrganizationForbidden"
        "404":
          $ref: "#/components/responses/MonitorNotFound"
  /api/v1/orgs/{organizationID}/dashboard/summary:
    get:
      operationId: getMonitorSummary
      summary: Count monitors by current state
      tags: [Monitors]
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/OrganizationID"
      responses:
        "200":
          description: UP, DOWN and UNKNOWN totals for the whole organization.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MonitorSummary" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OrganizationForbidden"
  /api/v1/orgs/{organizationID}/monitors/{monitorID}/metrics:
    get:
      operationId: getMonitorMetrics
      summary: Get 24-hour availability, latency aggregates and series
      tags: [Metrics]
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/OrganizationID"
        - $ref: "#/components/parameters/MonitorID"
      responses:
        "200":
          description: Metrics with null values when no data exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MonitorMetrics" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OrganizationForbidden"
        "404":
          $ref: "#/components/responses/MonitorNotFound"
  /api/v1/orgs/{organizationID}/monitors/{monitorID}/checks:
    get:
      operationId: listMonitorChecks
      summary: List monitor check results with pagination
      tags: [Metrics]
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/OrganizationID"
        - $ref: "#/components/parameters/MonitorID"
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        "200":
          description: A page of check results.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckResultList" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OrganizationForbidden"
        "404":
          $ref: "#/components/responses/MonitorNotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/orgs/{organizationID}/incidents:
    get:
      operationId: listIncidents
      summary: List organization or monitor incidents with pagination
      tags: [Incidents]
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/OrganizationID"
        - name: monitor_id
          in: query
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        "200":
          description: A page of incidents without monitor URLs or recipient emails.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncidentList" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OrganizationForbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
components:
  parameters:
    OrganizationID:
      name: organizationID
      in: path
      required: true
      schema: { type: string, format: uuid }
    MonitorID:
      name: monitorID
      in: path
      required: true
      schema: { type: string, format: uuid }
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: pulso_session
  responses:
    InvalidJSON:
      description: The JSON body is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    OriginForbidden:
      description: The request origin is not allowed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationFailed:
      description: One or more fields are invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    MonitorNotFound:
      description: The monitor does not exist in this organization.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Authentication is required or the session is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    OrganizationForbidden:
      description: The user does not belong to the organization.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    RegisterInput:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 128
          format: password
      additionalProperties: false
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
      additionalProperties: false
    Identity:
      type: object
      required: [user, organizations]
      properties:
        user:
          $ref: "#/components/schemas/User"
        organizations:
          type: array
          items:
            $ref: "#/components/schemas/Organization"
      additionalProperties: false
    User:
      type: object
      required: [id, name, email, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time
      additionalProperties: false
    Organization:
      type: object
      required: [id, name, role]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          type: string
          enum: [owner, admin, viewer]
      additionalProperties: false
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties:
                type: string
          additionalProperties: false
      additionalProperties: false
    MonitorMetrics:
      type: object
      required: [availability_24h, average_latency_ms, p95_latency_ms, series]
      properties:
        availability_24h: { type: [number, 'null'], format: double }
        average_latency_ms: { type: [number, 'null'], format: double }
        p95_latency_ms: { type: [number, 'null'], format: double }
        series:
          type: array
          items: { $ref: "#/components/schemas/MetricPoint" }
      additionalProperties: false
    MetricPoint:
      type: object
      required: [checked_at, latency_ms, success, http_status]
      properties:
        checked_at: { type: string, format: date-time }
        latency_ms: { type: integer, minimum: 0 }
        success: { type: boolean }
        http_status: { type: [integer, 'null'], minimum: 100, maximum: 599 }
      additionalProperties: false
    CheckResult:
      type: object
      required: [id, checked_at, success, http_status, latency_ms, error_summary]
      properties:
        id: { type: string, format: uuid }
        checked_at: { type: string, format: date-time }
        success: { type: boolean }
        http_status: { type: [integer, 'null'], minimum: 100, maximum: 599 }
        latency_ms: { type: integer, minimum: 0 }
        error_summary: { type: [string, 'null'] }
      additionalProperties: false
    CheckResultList:
      type: object
      required: [items, total, page, page_size, total_pages]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CheckResult" }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 50 }
        total_pages: { type: integer, minimum: 0 }
      additionalProperties: false
    Incident:
      type: object
      required: [id, monitor_id, opened_at, resolved_at, duration_ms, reason, status]
      properties:
        id: { type: string, format: uuid }
        monitor_id: { type: string, format: uuid }
        opened_at: { type: string, format: date-time }
        resolved_at: { type: [string, 'null'], format: date-time }
        duration_ms: { type: [integer, 'null'], format: int64 }
        reason: { type: string }
        status: { type: string, enum: [OPEN, RESOLVED] }
      additionalProperties: false
    IncidentList:
      type: object
      required: [items, total, page, page_size, total_pages]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Incident" }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 50 }
        total_pages: { type: integer, minimum: 0 }
      additionalProperties: false
    MonitorInput:
      type: object
      required: [name, url]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        url: { type: string, format: uri }
        interval_seconds: { type: integer, enum: [30, 60, 300], default: 60 }
        timeout_ms: { type: integer, minimum: 100, maximum: 10000, default: 5000 }
        expected_status_min: { type: integer, minimum: 100, maximum: 599, default: 200 }
        expected_status_max: { type: integer, minimum: 100, maximum: 599, default: 399 }
        show_public: { type: boolean, default: false }
      additionalProperties: false
    MonitorUpdateInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        url: { type: string, format: uri }
        interval_seconds: { type: integer, enum: [30, 60, 300] }
        timeout_ms: { type: integer, minimum: 100, maximum: 10000 }
        expected_status_min: { type: integer, minimum: 100, maximum: 599 }
        expected_status_max: { type: integer, minimum: 100, maximum: 599 }
        show_public: { type: boolean }
      additionalProperties: false
    Monitor:
      type: object
      required: [id, name, url, interval_seconds, timeout_ms, expected_status_min, expected_status_max, enabled, show_public, status, last_check_at, last_latency_ms, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        url: { type: string, format: uri }
        interval_seconds: { type: integer, enum: [30, 60, 300] }
        timeout_ms: { type: integer }
        expected_status_min: { type: integer }
        expected_status_max: { type: integer }
        enabled: { type: boolean }
        show_public: { type: boolean }
        status: { type: string, enum: [UNKNOWN, UP, DOWN] }
        last_check_at: { type: [string, 'null'], format: date-time }
        last_latency_ms: { type: [integer, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      additionalProperties: false
    MonitorList:
      type: object
      required: [items, total, page, page_size, total_pages]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Monitor" }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 50 }
        total_pages: { type: integer, minimum: 0 }
      additionalProperties: false
    MonitorSummary:
      type: object
      required: [up, down, unknown]
      properties:
        up: { type: integer, minimum: 0 }
        down: { type: integer, minimum: 0 }
        unknown: { type: integer, minimum: 0 }
      additionalProperties: false
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
      additionalProperties: false
    UnavailableStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: unavailable
      additionalProperties: false
